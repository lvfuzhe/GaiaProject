[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gaiazero"
version = "0.1.0"
description = "AlphaZero-style neural PIMCTS for a multiplayer Gaia Project rules engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[project.scripts]
gaiazero = "gaiazero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaiazero = [
    "web/*.html",
    "web/*.css",
    "web/*.js",
    "web/assets/sectors/*.gif",
    "web/assets/sectors/*.md",
    "web/assets/tiles/*.jpg",
    "web/assets/tiles/*.gif",
    "web/assets/tiles/*.png",
    "web/assets/tiles/*.md",
    "web/assets/boards/*.png",
    "web/assets/boards/*.md",
    "web/assets/factions/*.jpg",
    "web/assets/factions/*.md",
    "web/assets/map-pieces/*.png",
    "web/assets/map-pieces/*.md",
]
